spring:
  application:
    name: shoppal
  datasource:
    url: jdbc:h2:mem:shoppal;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: shoppal
        version: 0.1.0
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
server:
  address: 127.0.0.1
  port: 8080
  tomcat:
    max-http-form-post-size: 1MB
shoppal:
  seasonality:
    year: 2026
    # Illustrative multipliers; tune these to the shop's own history and local festival dates.
    festivals:
      - name: Vijayadashami
        start-date: 2026-10-20
        end-date: 2026-10-20
        multiplier: 1.15
      - name: Diwali
        start-date: 2026-11-08
        end-date: 2026-11-08
        multiplier: 1.30
